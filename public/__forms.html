<!doctype html>
<!-- Static form definition for Netlify Forms build-time detection.
     The live form in components/marketing/Consultation.tsx posts here. -->
<html>
  <head><title>Forms</title></head>
  <body>
    <form name="consultation" netlify netlify-honeypot="bot-field" action="/" method="POST" hidden>
      <input type="text" name="name" />
      <input type="text" name="restaurant" />
      <input type="email" name="email" />
      <input type="text" name="locations" />
      <textarea name="message"></textarea>
    </form>
  </body>
</html>
