# Netlify configuration for The Pass (Next.js App Router).
# Netlify auto-detects Next.js and provisions the Next Runtime; connecting
# this repo in the Netlify UI with these settings is all that's required.

# The migration runs first so a schema change ships with the code that
# reads it. db/schema.sql is guarded throughout, so this is a no-op on
# every deploy that does not change it, and it skips cleanly when no
# database is configured.
[build]
  command = "npm run db:migrate && npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Mocks live at /{client}-v{n}; the /spec/orravan URL already in front
# of the client keeps resolving.
[[redirects]]
  from = "/spec/orravan/*"
  to = "/orravan-v1/:splat"
  status = 301
